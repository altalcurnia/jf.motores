name: CI

on:
  pull_request:
  push:
    # migracion-next es la rama que hoy se publica en producción: se revisa en cada cambio
    branches: [main, migracion-next]

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Valores públicos (los mismos que ve el navegador). La clave secreta NUNCA va aquí.
      NEXT_PUBLIC_SUPABASE_URL: https://lsrjrwpxxqlgobablyyc.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_1tM02IsUi0DFz8WS87pHoQ_3vWU4HGm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
